<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Energy Advisor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="main-header">
    <div class="container header-container">
        <a href="index.html" class="logo">
            <div class="logo-icon"><i class="fa-solid fa-chart-network"></i></div>
            <span>Energy</span>Advisor
        </a>
    </div>
</header>
<section class="hero-section">
    <div class="container">
        <div class="card-wrapper login-card">
            <h2>Área Restrita</h2>
            <p>Entre com um usuário cadastrado na tabela <strong>usuarios</strong> do Supabase.</p>
            <form id="loginForm" class="premium-form login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="usuario@email.com">
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required placeholder="Digite sua senha">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>
            <p class="login-observacao">O sistema procura o e-mail e a senha no banco e, se encontrar, carrega o nome no cabeçalho.</p>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://qbfosnuwrqbjwbolmopj.supabase.co";
const SUPABASE_KEY = "sb_publishable_w76Z2U0x9epJ4XsxkQGQdg_lbAVlmHx";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();

    const { data, error } = await supabaseClient
        .from("usuarios")
        .select("id_usuario, nome, email")
        .eq("email", email)
        .eq("senha", senha)
        .maybeSingle();

    if (error) {
        console.error("Erro no login:", error);
        alert("Erro ao consultar o banco de dados.");
        return;
    }
    if (!data) {
        alert("Usuário não encontrado ou senha incorreta.");
        return;
    }

    localStorage.setItem("logado", "true");
    localStorage.setItem("usuarioAtual", JSON.stringify(data));
    localStorage.removeItem("empresaAtual");
    window.location.href = "index.html";
});
</script>
</body>
</html>
